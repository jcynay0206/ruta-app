<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUTA — Panel de agencia</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#14171C; --card:#1C2127; --card2:#242A34; --border:#2A303B;
    --amber:#FF9E2C; --green:#33C17A; --red:#E5484D; --text:#F2EFE9; --muted:#8B93A3;
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,'Inter',sans-serif; }
  html,body { background:var(--bg); color:var(--text); }
  a { color:inherit; text-decoration:none; }

  .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--border); }
  .brand { display:flex; align-items:center; gap:8px; }
  .brand .mark { width:28px; height:28px; border-radius:8px; background:var(--amber); display:flex; align-items:center; justify-content:center; font-weight:900; color:var(--bg); font-size:13px; }
  .brand b { font-weight:900; font-size:16px; letter-spacing:-0.02em; }
  .tabs { display:flex; gap:6px; }
  .tab-btn { padding:8px 16px; border-radius:8px; font-size:13.5px; font-weight:600; color:var(--muted); border:none; background:none; cursor:pointer; }
  .tab-btn.active { background:var(--card2); color:var(--text); }

  .wrap { max-width:1080px; margin:0 auto; padding:24px; }
  .panel { display:none; }
  .panel.show { display:block; }

  .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; }
  .card .icon-dot { width:32px; height:32px; border-radius:9px; background:var(--card2); display:flex; align-items:center; justify-content:center; color:var(--amber); font-size:15px; margin-bottom:10px; }
  .card .value { font-size:22px; font-weight:800; }
  .card .label { font-size:12px; color:var(--muted); margin-top:4px; }

  .box { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:18px; }
  .box h3 { font-size:14px; font-weight:700; margin-bottom:14px; }

  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--border); }
  td { padding:11px 10px; font-size:13px; border-bottom:1px solid var(--border); }
  tr:last-child td { border-bottom:none; }

  .pill { font-size:10.5px; font-weight:700; text-transform:uppercase; padding:3px 9px; border-radius:20px; }
  .pill.entregado, .pill.completado, .pill.pagado { color:#33C17A; background:rgba(51,193,122,0.12); }
  .pill.en_camino, .pill.pendiente { color:#FF9E2C; background:rgba(255,158,44,0.12); }
  .pill.fallido, .pill.vencido { color:#E5484D; background:rgba(229,72,77,0.12); }
  .pill.sin_iniciar { color:#8B93A3; background:rgba(139,147,163,0.12); }

  .btn { padding:9px 16px; border-radius:8px; font-size:13px; font-weight:700; border:none; cursor:pointer; }
  .btn-amber { background:var(--amber); color:var(--bg); }
  .btn-ghost { background:var(--card2); color:var(--text); border:1px solid var(--border); }

  .modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; z-index:20; }
  .modal-bg.show { display:flex; }
  .modal { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; width:100%; max-width:340px; }
  .modal h3 { font-size:15px; font-weight:700; margin-bottom:16px; }
  .modal label { display:block; font-size:11px; font-weight:700; text-transform:uppercase; color:var(--muted); margin:12px 0 5px; }
  .modal input { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:9px 11px; font-size:13.5px; color:var(--text); outline:none; }
  .modal input:focus { border-color:var(--amber); }
  .modal .actions { display:flex; gap:8px; margin-top:20px; }
  .modal .actions .btn { flex:1; }
  .form-error { color:var(--red); font-size:12px; margin-top:8px; display:none; }
  .form-error.show { display:block; }

  #loading, #error { padding:60px 24px; text-align:center; color:var(--muted); font-size:13px; }
  #error { color:var(--red); }
  canvas { max-height:200px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="mark">R</div><b>RUTA</b><span style="color:var(--muted);font-size:11px;font-weight:700;margin-left:4px">AGENCIA</span></div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="resumen" onclick="showTab('resumen')">Resumen</button>
    <button class="tab-btn" data-tab="conductores" onclick="showTab('conductores')">Conductores</button>
    <button class="tab-btn" data-tab="facturacion" onclick="showTab('facturacion')">Facturación</button>
  </div>
</div>

<div class="wrap" id="wrap">
  <div id="loading">Cargando datos de Supabase…</div>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3>Agregar conductor</h3>
    <label>Nombre completo</label>
    <input id="nd-name" placeholder="Ej. Yolanda Pérez">
    <label>Correo (para su login)</label>
    <input id="nd-email" type="email" placeholder="conductor@correo.com">
    <label>Teléfono</label>
    <input id="nd-phone" placeholder="305-555-0100">
    <label>Vehículo</label>
    <input id="nd-vehicle" placeholder="Ej. Van #05">
    <label>Contraseña temporal</label>
    <input id="nd-password" type="text" placeholder="Mínimo 6 caracteres">
    <div class="form-error" id="nd-error"></div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-amber" id="nd-submit" onclick="createDriver()">Crear</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://zvuoxvvauxfluhimylfz.supabase.co";
const SUPABASE_KEY = "sb_publishable_66RQoNajgb8VjMLKcj6mwA_Yf_QlRwg";
const AGENCY_ID = "11111111-1111-1111-1111-111111111111"; // Agencia Demo RUTA
const headers = { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY, "Content-Type": "application/json", Prefer: "return=representation" };

async function sb(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers });
  if (!res.ok) throw new Error(`Error cargando ${path}`);
  return res.json();
}

let agency = null, drivers = [], deliveries = [], invoices = [];
const WEEKDAY = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];

async function loadAll() {
  try {
    [agency, drivers, deliveries, invoices] = await Promise.all([
      sb("agencies?select=*&limit=1").then(r => r[0]),
      sb("drivers?select=*"),
      sb("deliveries?select=*"),
      sb("invoices?select=*&order=due_date.asc"),
    ]);
    render();
  } catch (e) {
    document.getElementById('wrap').innerHTML = `<div id="error">No se pudo conectar a Supabase: ${e.message}</div>`;
  }
}

function driverStats(d) {
  const own = deliveries.filter(x => x.driver_id === d.id);
  const done = own.filter(x => x.status === 'entregado').length;
  const failed = own.filter(x => x.status === 'fallido').length;
  let status = 'sin_iniciar';
  if (failed > 0) status = 'fallido';
  else if (own.length && done === own.length) status = 'completado';
  else if (own.some(x => x.status === 'en_camino' || x.status === 'entregado')) status = 'en_camino';
  return { stops: own.length, done, status };
}

function render() {
  const delivered = deliveries.filter(d => d.status === 'entregado').length;
  const failed = deliveries.filter(d => d.status === 'fallido').length;
  const activeDrivers = drivers.filter(d => driverStats(d).status !== 'sin_iniciar').length;
  const revenue = invoices.filter(i => i.status === 'pagado').reduce((s,i) => s + Number(i.amount), 0);
  const pending = invoices.filter(i => i.status === 'pendiente').reduce((s,i) => s + Number(i.amount), 0);
  const overdue = invoices.filter(i => i.status === 'vencido').reduce((s,i) => s + Number(i.amount), 0);

  document.getElementById('wrap').innerHTML = `
    <div class="panel show" id="panel-resumen">
      <div class="cards">
        <div class="card"><div class="icon-dot">📦</div><div class="value">${delivered} / ${deliveries.length}</div><div class="label">Entregas hoy</div></div>
        <div class="card"><div class="icon-dot">👤</div><div class="value">${activeDrivers} de ${drivers.length}</div><div class="label">Conductores activos</div></div>
        <div class="card"><div class="icon-dot">💲</div><div class="value">$${revenue.toFixed(2)}</div><div class="label">Ingresos cobrados</div></div>
        <div class="card"><div class="icon-dot">✕</div><div class="value">${failed}</div><div class="label">Entregas fallidas</div></div>
      </div>
      <div class="box"><h3>Entregas por día</h3><canvas id="chart"></canvas></div>
      <div class="box">
        <h3>Conductores</h3>
        <table><thead><tr><th>Conductor</th><th>Vehículo</th><th>Progreso</th><th>Estado</th></tr></thead>
        <tbody>${drivers.map(d => {
          const s = driverStats(d);
          return `<tr><td>${d.name}</td><td>${d.vehicle||'—'}</td><td>${s.done}/${s.stops}</td><td><span class="pill ${s.status}">${s.status.replace('_',' ')}</span></td></tr>`;
        }).join('')}</tbody></table>
      </div>
    </div>

    <div class="panel" id="panel-conductores">
      <div style="display:flex;justify-content:flex-end;margin-bottom:14px">
        <button class="btn btn-amber" onclick="openModal()">+ Agregar conductor</button>
      </div>
      <div class="box">
        <table><thead><tr><th>Conductor</th><th>Correo</th><th>Teléfono</th><th>Vehículo</th><th>Estado</th></tr></thead>
        <tbody>${drivers.map(d => {
          const s = driverStats(d);
          return `<tr><td>${d.name}</td><td>${d.email||'—'}</td><td>${d.phone||'—'}</td><td>${d.vehicle||'—'}</td><td><span class="pill ${s.status}">${s.status.replace('_',' ')}</span></td></tr>`;
        }).join('')}</tbody></table>
      </div>
    </div>

    <div class="panel" id="panel-facturacion">
      <div class="cards" style="grid-template-columns:repeat(3,1fr)">
        <div class="card"><div class="icon-dot">💲</div><div class="value">$${revenue.toFixed(2)}</div><div class="label">Cobrado</div></div>
        <div class="card"><div class="icon-dot">🕐</div><div class="value">$${pending.toFixed(2)}</div><div class="label">Pendiente</div></div>
        <div class="card"><div class="icon-dot">✕</div><div class="value">$${overdue.toFixed(2)}</div><div class="label">Vencido</div></div>
      </div>
      <div class="box">
        <table><thead><tr><th>Periodo</th><th>Monto</th><th>Vence</th><th>Estado</th></tr></thead>
        <tbody>${invoices.map(i => `<tr><td>${i.period}</td><td>$${Number(i.amount).toFixed(2)}</td><td>${new Date(i.due_date).toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</td><td><span class="pill ${i.status}">${i.status}</span></td></tr>`).join('')}</tbody></table>
      </div>
    </div>
  `;

  const chartMap = {};
  deliveries.forEach(d => { const day = WEEKDAY[new Date(d.created_at).getDay()]; chartMap[day] = (chartMap[day]||0)+1; });
  new Chart(document.getElementById('chart'), {
    type: 'line',
    data: { labels: WEEKDAY, datasets: [{ data: WEEKDAY.map(d => chartMap[d]||0), borderColor: '#FF9E2C', backgroundColor: 'rgba(255,158,44,0.1)', tension: 0.3, fill: true }] },
    options: { plugins: { legend: { display: false } }, scales: { x: { ticks:{color:'#8B93A3'}, grid:{color:'#2A303B'} }, y: { ticks:{color:'#8B93A3'}, grid:{color:'#2A303B'} } } }
  });
}

function showTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('show'));
  document.getElementById('panel-' + name)?.classList.add('show');
}
window.showTab = showTab;

function openModal() { document.getElementById('modal-bg').classList.add('show'); }
window.openModal = openModal;
function closeModal() { document.getElementById('modal-bg').classList.remove('show'); document.getElementById('nd-error').classList.remove('show'); }
window.closeModal = closeModal;

async function createDriver() {
  const name = document.getElementById('nd-name').value.trim();
  const email = document.getElementById('nd-email').value.trim();
  const phone = document.getElementById('nd-phone').value.trim();
  const vehicle = document.getElementById('nd-vehicle').value.trim();
  const password = document.getElementById('nd-password').value;
  const errEl = document.getElementById('nd-error');
  const btn = document.getElementById('nd-submit');
  errEl.classList.remove('show');

  if (!name || !email || !password || password.length < 6) {
    errEl.textContent = 'Nombre, correo y contraseña (mínimo 6 caracteres) son obligatorios';
    errEl.classList.add('show');
    return;
  }

  btn.disabled = true; btn.textContent = 'Creando…';
  try {
    // 1. Crear su cuenta de login
    const signupRes = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const signupData = await signupRes.json();
    if (!signupRes.ok) throw new Error(signupData.msg || signupData.error_description || 'No se pudo crear la cuenta');

    // 2. Crear su registro de conductor, ya ligado a su cuenta
    const driverRes = await fetch(`${SUPABASE_URL}/rest/v1/drivers`, {
      method: 'POST', headers,
      body: JSON.stringify({ agency_id: AGENCY_ID, name, email, phone, vehicle, auth_user_id: signupData.user?.id || null })
    });
    if (!driverRes.ok) throw new Error('Cuenta creada, pero no se pudo guardar el conductor');

    closeModal();
    ['nd-name','nd-email','nd-phone','nd-vehicle','nd-password'].forEach(id => document.getElementById(id).value = '');
    await loadAll();
    showTab('conductores');
  } catch (e) {
    errEl.textContent = e.message;
    errEl.classList.add('show');
  } finally {
    btn.disabled = false; btn.textContent = 'Crear';
  }
}
window.createDriver = createDriver;

loadAll();
setInterval(loadAll, 15000);
</script>
</body>
</html>
