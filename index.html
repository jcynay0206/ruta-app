<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUTA — App del conductor</title>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC5Axkmkyq32XfhTyvtZDLu7GAEVx6HBao&libraries=geometry"></script>
<style>
  :root {
    --bg:#14171C; --card:#1C2127; --card2:#242A34; --border:#2A303B;
    --amber:#FF9E2C; --green:#33C17A; --red:#E5484D; --text:#F2EFE9; --muted:#8B93A3;
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,'Inter',sans-serif; }
  html,body { height:100%; background:var(--bg); color:var(--text); }
  #app { height:100%; display:flex; flex-direction:column; }

  header { padding:14px 16px; border-bottom:1px solid var(--border); }
  .brand { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .brand .mark { width:26px; height:26px; border-radius:7px; background:var(--amber); display:flex; align-items:center; justify-content:center; font-weight:900; color:var(--bg); font-size:13px; }
  .brand b { font-weight:900; font-size:15px; letter-spacing:-0.02em; }
  .progress-row { display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--muted); margin-bottom:6px; }
  .progress-row b { color:var(--text); }
  .bar { height:6px; border-radius:3px; background:var(--border); overflow:hidden; }
  .bar-fill { height:100%; background:var(--amber); transition:width .4s; }

  #map { height:220px; width:100%; filter: saturate(0.6) brightness(0.85); position:relative; }
  .map-wrap { position:relative; }
  .nav-toggle { position:absolute; top:10px; right:10px; z-index:5; background:var(--amber); color:var(--bg); font-size:12px; font-weight:700; border:none; padding:8px 12px; border-radius:20px; display:flex; align-items:center; gap:5px; }
  .nav-toggle.stop-nav { background:var(--card2); color:var(--text); border:1px solid var(--border); }

  .nav-panel { background:var(--card2); border-bottom:1px solid var(--border); padding:14px 16px; display:none; }
  .nav-panel.show { display:block; }
  .nav-panel .step-text { font-size:15px; font-weight:600; line-height:1.35; margin-bottom:4px; }
  .nav-panel .step-text b { color:var(--amber); }
  .nav-panel .step-meta { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .nav-panel .gps-dot { width:7px; height:7px; border-radius:50%; background:var(--green); }
  .nav-panel .gps-dot.searching { background:var(--muted); animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  #list { flex:1; overflow-y:auto; padding:12px 16px; }
  .stop { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px; border-radius:12px; border:1px solid var(--border); background:var(--card); margin-bottom:8px; }
  .stop.active { border-color:var(--amber); background:var(--card2); }
  .stop .dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .stop-info { flex:1; min-width:0; }
  .stop-info .name { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stop-info .addr { font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge { font-size:10px; font-weight:700; text-transform:uppercase; padding:3px 8px; border-radius:20px; white-space:nowrap; }

  .actions { display:flex; gap:8px; margin-top:8px; }
  .btn { flex:1; padding:9px; border-radius:8px; font-size:12.5px; font-weight:700; border:none; }
  .btn-deliver { background:var(--green); color:#0E1712; }
  .btn-deliver:disabled { background:var(--border); color:#5A6272; }
  .btn-fail { background:transparent; color:var(--red); border:1px solid var(--red); }
  .btn-link { background:none; border:none; color:var(--amber); font-size:11.5px; font-weight:600; padding:6px 0; text-align:left; }

  .stop-wrap { border:1px solid var(--border); border-radius:12px; background:var(--card); margin-bottom:8px; overflow:hidden; }
  .stop-wrap.active { border-color:var(--amber); }
  .proof-panel { padding:0 12px 12px; border-top:1px solid var(--border); margin-top:2px; }
  .proof-label { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); margin:12px 0 6px; }
  .photo-box { width:100%; height:110px; border-radius:10px; border:1.5px dashed var(--border); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px; color:var(--muted); font-size:12px; cursor:pointer; overflow:hidden; position:relative; }
  .photo-box img { width:100%; height:100%; object-fit:cover; }
  #sig-canvas { width:100%; height:100px; border-radius:10px; background:var(--bg); border:1px solid var(--border); touch-action:none; }


  #status-msg { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); font-size:13px; font-weight:600; padding:9px 16px; border-radius:20px; opacity:0; transition:opacity .3s; pointer-events:none; }
  #status-msg.show { opacity:1; }
  #loading { padding:40px 16px; text-align:center; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><div class="mark">R</div><b>RUTA</b></div>
    <div class="progress-row"><span>Progreso de hoy</span><span><b id="done-count">0</b> de <b id="total-count">0</b></span></div>
    <div class="bar"><div class="bar-fill" id="bar-fill" style="width:0%"></div></div>
  </header>

  <div id="nav-panel" class="nav-panel">
    <div class="step-text" id="nav-step-text">—</div>
    <div class="step-meta">
      <span class="gps-dot searching" id="gps-dot"></span>
      <span id="nav-step-meta">Buscando GPS…</span>
    </div>
  </div>

  <div class="map-wrap">
    <button class="nav-toggle" id="nav-toggle-btn" onclick="toggleNavigation()">🧭 Iniciar navegación</button>
    <div id="map"></div>
  </div>

  <div id="list"><div id="loading">Cargando entregas de Supabase…</div></div>
</div>
<div id="status-msg"></div>

<script>
const SUPABASE_URL = "https://zvuoxvvauxfluhimylfz.supabase.co";
const SUPABASE_KEY = "sb_publishable_66RQoNajgb8VjMLKcj6mwA_Yf_QlRwg";
const DRIVER_ID = "22222222-2222-2222-2222-222222222221"; // Carlos Méndez (demo)

const headers = {
  apikey: SUPABASE_KEY,
  Authorization: "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json",
  Prefer: "return=representation"
};

const STATUS_META = {
  pendiente:  { color:"#4A5262", bg:"rgba(139,147,163,0.12)", fg:"#9AA3B2", label:"Pendiente" },
  en_camino:  { color:"#FF9E2C", bg:"rgba(255,158,44,0.12)",  fg:"#FF9E2C", label:"En camino" },
  entregado:  { color:"#33C17A", bg:"rgba(51,193,122,0.12)",  fg:"#33C17A", label:"Entregado" },
  fallido:    { color:"#E5484D", bg:"rgba(229,72,77,0.12)",   fg:"#E5484D", label:"Fallido" }
};

let map, markers = [], directionsRenderer, directionsService, stops = [];
const GOOGLE_MAPS_STYLE = [
  { elementType: "geometry", stylers: [{ color: "#1C2127" }] },
  { elementType: "labels.text.fill", stylers: [{ color: "#8B93A3" }] },
  { elementType: "labels.text.stroke", stylers: [{ color: "#14171C" }] },
  { featureType: "road", elementType: "geometry", stylers: [{ color: "#2A303B" }] },
  { featureType: "water", elementType: "geometry", stylers: [{ color: "#101418" }] },
  { featureType: "poi", stylers: [{ visibility: "off" }] }
];

function initMap() {
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 25.77, lng: -80.25 },
    zoom: 12,
    disableDefaultUI: true,
    styles: GOOGLE_MAPS_STYLE
  });
  directionsService = new google.maps.DirectionsService();
  directionsRenderer = new google.maps.DirectionsRenderer({
    map, suppressMarkers: true,
    polylineOptions: { strokeColor: '#FF9E2C', strokeWeight: 3, strokeOpacity: 0.7 }
  });
}

function computeOptimizedRoute(activeStops) {
  if (activeStops.length < 2) return;
  const origin = activeStops[0];
  const destination = activeStops[activeStops.length - 1];
  const waypoints = activeStops.slice(1, -1).map(s => ({
    location: { lat: s.latitude, lng: s.longitude }, stopover: true
  }));
  directionsService.route({
    origin: { lat: origin.latitude, lng: origin.longitude },
    destination: { lat: destination.latitude, lng: destination.longitude },
    waypoints,
    optimizeWaypoints: true,
    travelMode: google.maps.TravelMode.DRIVING
  }, (result, status) => {
    if (status === 'OK') {
      directionsRenderer.setDirections(result);
      navSteps = result.routes[0].legs.flatMap(leg => leg.steps);
      currentStepIndex = 0;
      if (navigationActive) updateNavPanel();
    } else {
      console.error('Directions API error:', status);
      toast('Error de rutas: ' + status);
    }
  });
}

// ---- Navegación paso a paso con GPS real (sin voz) ----
let navSteps = [];
let currentStepIndex = 0;
let navigationActive = false;
let watchId = null;
let driverDot = null;

function toggleNavigation() {
  navigationActive = !navigationActive;
  const btn = document.getElementById('nav-toggle-btn');
  const panel = document.getElementById('nav-panel');
  if (navigationActive) {
    btn.textContent = '✕ Detener';
    btn.classList.add('stop-nav');
    panel.classList.add('show');
    startGpsTracking();
  } else {
    btn.textContent = '🧭 Iniciar navegación';
    btn.classList.remove('stop-nav');
    panel.classList.remove('show');
    stopGpsTracking();
  }
}
window.toggleNavigation = toggleNavigation;

function startGpsTracking() {
  if (!navigator.geolocation) {
    toast('Este dispositivo no soporta GPS');
    return;
  }
  watchId = navigator.geolocation.watchPosition(onGpsUpdate, onGpsError, {
    enableHighAccuracy: true, maximumAge: 3000, timeout: 10000
  });
}

function stopGpsTracking() {
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  watchId = null;
}

function onGpsError() {
  document.getElementById('gps-dot').className = 'gps-dot searching';
  document.getElementById('nav-step-meta').textContent = 'Sin señal de GPS — verifica permisos de ubicación';
}

function onGpsUpdate(pos) {
  const here = new google.maps.LatLng(pos.coords.latitude, pos.coords.longitude);

  // Blue driver dot on the map
  if (!driverDot) {
    driverDot = new google.maps.Marker({
      position: here, map,
      icon: { path: google.maps.SymbolPath.CIRCLE, scale: 7, fillColor: '#4285F4', fillOpacity: 1, strokeColor: '#FFFFFF', strokeWeight: 2 },
      zIndex: 999
    });
  } else {
    driverDot.setPosition(here);
  }

  // Auto-advance to next instruction when close to the end of the current step
  if (navSteps[currentStepIndex]) {
    const stepEnd = navSteps[currentStepIndex].end_location;
    const dist = google.maps.geometry.spherical.computeDistanceBetween(here, stepEnd);
    if (dist < 30 && currentStepIndex < navSteps.length - 1) {
      currentStepIndex++;
    }
  }
  updateNavPanel();
}

function updateNavPanel() {
  const step = navSteps[currentStepIndex];
  document.getElementById('gps-dot').className = 'gps-dot';
  if (!step) {
    document.getElementById('nav-step-text').textContent = 'Ruta no disponible todavía';
    document.getElementById('nav-step-meta').textContent = '';
    return;
  }
  document.getElementById('nav-step-text').innerHTML = step.instructions;
  const isLast = currentStepIndex === navSteps.length - 1;
  document.getElementById('nav-step-meta').textContent =
    `${step.distance.text} · Paso ${currentStepIndex + 1} de ${navSteps.length}${isLast ? ' · Última indicación' : ''}`;
}

function toast(msg) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

async function loadDeliveries() {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/deliveries?driver_id=eq.${DRIVER_ID}&order=sequence.asc`,
    { headers }
  );
  if (!res.ok) {
    document.getElementById('list').innerHTML = '<div id="loading">No se pudo conectar a Supabase. Revisa las políticas de la tabla.</div>';
    return;
  }
  stops = await res.json();
  render();
}

function render() {
  const done = stops.filter(s => s.status === 'entregado').length;
  document.getElementById('done-count').textContent = done;
  document.getElementById('total-count').textContent = stops.length;
  document.getElementById('bar-fill').style.width = stops.length ? (done/stops.length*100) + '%' : '0%';

  // Map markers
  markers.forEach(m => m.setMap(null));
  markers = [];
  const bounds = new google.maps.LatLngBounds();
  stops.forEach(s => {
    if (s.latitude == null || s.longitude == null) return;
    const meta = STATUS_META[s.status] || STATUS_META.pendiente;
    const pos = { lat: s.latitude, lng: s.longitude };
    const marker = new google.maps.Marker({
      position: pos, map,
      title: s.stop_name,
      icon: { path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: meta.color, fillOpacity: 1, strokeColor: '#14171C', strokeWeight: 2 }
    });
    markers.push(marker);
    bounds.extend(pos);
  });
  if (markers.length) map.fitBounds(bounds, 40);

  // Real optimized route (Directions API) over remaining stops
  const activeStops = stops.filter(s => (s.status === 'pendiente' || s.status === 'en_camino') && s.latitude != null);
  computeOptimizedRoute(activeStops);

  // List
  const activeId = (stops.find(s => s.status === 'en_camino') || stops.find(s => s.status === 'pendiente'))?.id;
  const list = document.getElementById('list');
  list.innerHTML = '';
  stops.forEach(s => {
    const meta = STATUS_META[s.status] || STATUS_META.pendiente;
    const openable = s.status === 'pendiente' || s.status === 'en_camino';
    const isOpen = expandedId === s.id;
    const requiresSig = (s.special_note || '').toLowerCase().includes('firma');

    const wrap = document.createElement('div');
    wrap.className = 'stop-wrap' + (s.id === activeId ? ' active' : '');

    wrap.innerHTML = `
      <div class="stop" style="cursor:${openable ? 'pointer' : 'default'}" ${openable ? `onclick="toggleExpand('${s.id}')"` : ''}>
        <div class="dot" style="background:${meta.color}"></div>
        <div class="stop-info">
          <div class="name">${s.stop_name}</div>
          <div class="addr">${s.address}${s.special_note ? ' · ' + s.special_note : ''}</div>
        </div>
        <span class="badge" style="background:${meta.bg};color:${meta.fg}">${meta.label}</span>
      </div>
      ${isOpen ? `
        <div class="proof-panel">
          <div class="proof-label">Foto de prueba de entrega</div>
          <label class="photo-box" id="photo-box">
            <span id="photo-placeholder">📷 Tocar para tomar foto</span>
            <input type="file" accept="image/*" capture="environment" style="display:none" onchange="onPhotoSelected(event)">
          </label>
          ${requiresSig ? `
            <div class="proof-label">Firma del cliente</div>
            <canvas id="sig-canvas" width="300" height="100"></canvas>
            <button class="btn-link" onclick="clearSignature()">Borrar firma</button>
          ` : ''}
          <div class="actions" style="margin-top:12px">
            <button class="btn btn-deliver" id="confirm-btn" disabled onclick="confirmDelivery('${s.id}', ${requiresSig})">✓ Confirmar entrega</button>
            <button class="btn btn-fail" onclick="markFailed('${s.id}')">✕ Fallido</button>
          </div>
        </div>
      ` : ''}
    `;
    list.appendChild(wrap);
  });

  if (expandedId) {
    capturedPhotoBlob = null;
    updateConfirmButton();
    const canvas = document.getElementById('sig-canvas');
    if (canvas) setupSignaturePad(canvas);
  }
}

// ---- Photo + signature capture state ----
let expandedId = null;
let capturedPhotoBlob = null;
let signatureHasStrokes = false;

function toggleExpand(id) {
  expandedId = expandedId === id ? null : id;
  render();
}
window.toggleExpand = toggleExpand;

function onPhotoSelected(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  capturedPhotoBlob = file;
  const box = document.getElementById('photo-box');
  box.innerHTML = `<img src="${URL.createObjectURL(file)}">`;
  updateConfirmButton();
}
window.onPhotoSelected = onPhotoSelected;

function updateConfirmButton() {
  const btn = document.getElementById('confirm-btn');
  if (!btn) return;
  const requiresSig = document.getElementById('sig-canvas') != null;
  btn.disabled = !capturedPhotoBlob || (requiresSig && !signatureHasStrokes);
}

function setupSignaturePad(canvas) {
  signatureHasStrokes = false;
  const ctx = canvas.getContext('2d');
  let drawing = false;
  const pos = (e) => {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: (t.clientX - r.left) * (canvas.width / r.width), y: (t.clientY - r.top) * (canvas.height / r.height) };
  };
  const start = (e) => { drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
  const move = (e) => {
    if (!drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.lineTo(p.x, p.y); ctx.strokeStyle = '#F2EFE9'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.stroke();
    signatureHasStrokes = true;
    updateConfirmButton();
  };
  const end = () => { drawing = false; };
  canvas.onmousedown = start; canvas.onmousemove = move; canvas.onmouseup = end; canvas.onmouseleave = end;
  canvas.ontouchstart = start; canvas.ontouchmove = move; canvas.ontouchend = end;
}

function clearSignature() {
  const canvas = document.getElementById('sig-canvas');
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  signatureHasStrokes = false;
  updateConfirmButton();
}
window.clearSignature = clearSignature;

async function uploadToStorage(path, blob, contentType) {
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/delivery-proofs/${path}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': contentType },
    body: blob
  });
  if (!res.ok) throw new Error('Upload failed: ' + await res.text());
  return `${SUPABASE_URL}/storage/v1/object/public/delivery-proofs/${path}`;
}

function canvasToBlob(canvas) {
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

async function confirmDelivery(id, requiresSig) {
  const btn = document.getElementById('confirm-btn');
  btn.disabled = true;
  btn.textContent = 'Subiendo…';
  try {
    const photoUrl = await uploadToStorage(`${id}-photo-${Date.now()}.jpg`, capturedPhotoBlob, capturedPhotoBlob.type || 'image/jpeg');
    let signatureUrl = null;
    if (requiresSig) {
      const canvas = document.getElementById('sig-canvas');
      const blob = await canvasToBlob(canvas);
      signatureUrl = await uploadToStorage(`${id}-signature-${Date.now()}.png`, blob, 'image/png');
    }
    const res = await fetch(`${SUPABASE_URL}/rest/v1/deliveries?id=eq.${id}`, {
      method: 'PATCH',
      headers,
      body: JSON.stringify({ status: 'entregado', photo_url: photoUrl, signature_url: signatureUrl })
    });
    if (!res.ok) throw new Error('update failed');
    toast('Entrega confirmada ✓');
    expandedId = null;
    await loadDeliveries();
  } catch (err) {
    toast('Error al subir la prueba — intenta de nuevo');
    btn.disabled = false;
    btn.textContent = '✓ Confirmar entrega';
  }
}
window.confirmDelivery = confirmDelivery;

async function markFailed(id) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/deliveries?id=eq.${id}`, {
    method: 'PATCH',
    headers,
    body: JSON.stringify({ status: 'fallido' })
  });
  if (res.ok) {
    toast('Marcado como fallido');
    expandedId = null;
    await loadDeliveries();
  } else {
    toast('Error al actualizar');
  }
}
window.markFailed = markFailed;

initMap();
loadDeliveries();
setInterval(loadDeliveries, 15000); // refresca cada 15s, simula tiempo real
</script>
</body>
</html>
